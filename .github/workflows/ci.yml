name: 🎽 CI

on:
  push:
    branches:
      - main
    paths:
      - "**.rb"
      - .github/workflows/ci.yml
      - .github/workflows/install-package.yml
      - .github/actions/setup-homebrew-with-tap/action.yml
  pull_request:
    paths:
      - "**.rb"
      - .github/workflows/ci.yml
      - .github/workflows/install-package.yml
      - .github/actions/setup-homebrew-with-tap/action.yml
  schedule:
    - cron: 0 0 * * SAT

permissions: {}

jobs:
  test:
    name: 🧪 Test
    runs-on: macOS-Latest
    timeout-minutes: 3

    steps:
      - name: 🚚 Check out repository
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 🍺 Set up Homebrew with Tap
        id: homebrew
        uses: ./.github/actions/setup-homebrew-with-tap
        with:
          ref: ${{ steps.checkout.outputs.commit }}
          install-bundler-gems: true

      - name: 🧹 Cleanup Test Bot
        run: brew test-bot --verbose --only-cleanup-before

      - name: 💈 Check files for style guidelines
        run: brew style -dv "$GITHUB_REPOSITORY"

      - name: ⚠️ Check if any files have Ruby issues
        run: brew readall -dv "$GITHUB_REPOSITORY"

      - name: 📊 Check for coding style violations
        run: brew audit -dv --strict --tap="$GITHUB_REPOSITORY"

  detect-changed-packages:
    name: 🔍 Detect Changed Packages
    runs-on: Ubuntu-Latest
    timeout-minutes: 1
    outputs:
      packages: ${{ steps.collect.outputs.packages }}

    steps:
      - name: 🚚 Check out repository
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 🍺 Set up Homebrew with Tap
        uses: ./.github/actions/setup-homebrew-with-tap
        with:
          ref: ${{ steps.checkout.outputs.commit }}

      - name: 🔄 Filter the changed files
        id: filter
        uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        with:
          filters: |
            package:
              - added|modified: "**.rb"
            workflow: [.github/workflows/ci.yml, .github/workflows/install-package.yml, .github/actions/setup-homebrew-with-tap/action.yml]
          list-files: shell

      - name: 📡 Collect package information
        id: collect
        run: |
          echo "packages=$(jq -c '[
            (.formulae[] | { name: .name, macos_only: (.requirements | any(.name == "macos")), full_name: .full_name }),
            (.casks[] | { name: .name[0], macos_only: true, full_name: .full_token })
          ]' <<<"$(
            if "$workflowChanged" || "$scheduled"; then
              find "$GITHUB_WORKSPACE" -name '*.rb'
            else
              echo "$changedPackages"
            fi | xargs basename -s .rb | xargs brew info --json=v2
          )")" | tee -a "$GITHUB_OUTPUT"
        env:
          changedPackages: ${{ steps.filter.outputs.package_files }}
          workflowChanged: ${{ steps.filter.outputs.workflow }}
          scheduled: ${{ github.event_name == 'schedule' }}

  install:
    name: 📥 Install ${{ matrix.package.name }}
    needs: detect-changed-packages
    uses: ./.github/workflows/install-package.yml
    with:
      package: ${{ matrix.package.full_name }}
      macos_only: ${{ matrix.package.macos_only }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changed-packages.outputs.packages) }}
