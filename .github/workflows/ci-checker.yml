name: ✅ CI Checker

on:
  pull_request:

permissions: {}

jobs:
  merge-gatekeeper:
    name: 🛡️ Merge Gatekeeper
    permissions:
      checks: read
      statuses: read
    runs-on: Ubuntu-Latest
    timeout-minutes: 10

    steps:
      - name: 🛡️ Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@09af7a82c1666d0e64d2bd8c01797a0bcfd3bb5d # v1.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          self: 🛡️ Merge Gatekeeper

  get-app-name:
    name: 🤖 Get GitHub App Name
    runs-on: Ubuntu-Slim
    environment: CI-Checker
    timeout-minutes: 1
    outputs:
      app-name: ${{ steps.output-app-name.outputs.app-name }}

    steps:
      - name: 💳 Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-metadata: read

      - name: 📝 Output app name
        id: output-app-name
        run: echo "app-name=${APP_SLUG}[bot]" | tee -a "$GITHUB_OUTPUT"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

  merge-pr:
    name: 🔀 Merge PR
    needs: [merge-gatekeeper, get-app-name]
    if: ${{ github.event.pull_request.user.login == needs.get-app-name.outputs.app-name && startsWith(github.head_ref, 'bump-') }}
    runs-on: Ubuntu-Slim
    environment: CI-Checker
    timeout-minutes: 1

    steps:
      - name: 💳 Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 🔀 Squash merge PR
        run: gh pr merge --repo="$GITHUB_REPOSITORY" "$GITHUB_HEAD_REF" --squash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
