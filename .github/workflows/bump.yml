name: ✨ Bump Packages

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bump:
    name: ✨ Bump Packages
    permissions:
      contents: read
    runs-on: macos-26
    environment:
      name: Bump
      deployment: false
    timeout-minutes: 3

    steps:
      - name: 🚚 Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🍺 Set up Homebrew with Tap
        id: homebrew
        uses: $/.github/actions/setup-homebrew-with-tap
        with:
          ref: ${{ steps.checkout.outputs.commit }}
          install-bundler-gems: true

      - name: 💳 Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BREW_COMMIT_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 🐙 Configure Git
        run: |
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "$(gh api "/users/${APP_SLUG}[bot]" --jq='.id')+${APP_SLUG}[bot]@users.noreply.github.com"
          cp scripts/pre-commit "$tap/.git/hooks/pre-commit"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug}}
          tap: ${{ steps.homebrew.outputs.repository-path }}

      - name: ✨ Version up Homebrew Packages
        run: brew bump --tap="$GITHUB_REPOSITORY" --{open-pr,no-fork}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
