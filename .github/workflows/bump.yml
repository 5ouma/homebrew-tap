name: ✨ Bump Packages

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions: {}

jobs:
  bump-packages:
    name: ✨ Bump Packages
    runs-on: Ubuntu-Latest
    timeout-minutes: 3

    steps:
      - name: 🚚 Check out repository
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 🍺 Set up Homebrew with Tap
        id: homebrew
        uses: ./.github/actions/setup-homebrew-with-tap
        with:
          ref: ${{ steps.checkout.outputs.commit }}
          install-bundler-gems: true

      - name: 🐙 Configure Git User
        run: |
          git config --global user.name "$(gh api /user --jq='.name')"
          git config --global user.email "$GITHUB_REPOSITORY_OWNER_ID+$GITHUB_REPOSITORY_OWNER@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}

      - name: ✨ Version up Homebrew Packages
        run: brew bump --tap="$GITHUB_REPOSITORY" --open-pr --no-fork
        env:
          HOMEBREW_EVAL_ALL: true
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.TOKEN }}
