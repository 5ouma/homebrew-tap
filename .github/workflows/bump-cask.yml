name: ✨ Bump Casks

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || github.ref }}
  cancel-in-progress: true

jobs:
  bump-casks:
    name: ✨ Bump Casks
    runs-on: Ubuntu-Latest
    environment:
      name: Bump-Cask
      deployment: false
    timeout-minutes: 3

    steps:
      - name: 🚚 Check out repository
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 🍺 Set up Homebrew with Tap
        id: homebrew
        uses: ./.github/actions/setup-homebrew-with-tap
        with:
          ref: ${{ steps.checkout.outputs.commit }}
          install-bundler-gems: true

      - name: 💳 Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.BREW_COMMIT_APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 🐙 Configure Git user
        run: |
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "$(gh api "/users/${APP_SLUG}[bot]" --jq='.id')+${APP_SLUG}[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug}}

      - name: ✨ Version up Homebrew Casks
        run: brew bump --tap="$GITHUB_REPOSITORY" --{cask,open-pr,no-fork}
        env:
          HOMEBREW_EVAL_ALL: true
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
