name: 📥 Install Package

on:
  workflow_call:
    inputs:
      package:
        description: The package to install
        required: true
        type: string
      macos_only:
        description: Whether the package is macOS only
        required: true
        type: boolean

permissions: {}

jobs:
  install:
    name: ${{ case(startsWith(matrix.os, 'macOS-'), '🍎', startsWith(matrix.os, 'Ubuntu-'), '🐧', '❓') }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(format('["macOS-15","macOS-26"{0}]', case(inputs.macos_only, '', ',"Ubuntu-24.04","Ubuntu-24.04-ARM","Ubuntu-26.04","Ubuntu-26.04-ARM"'))) }}

    steps:
      - name: 🚚 Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🍺 Set up Homebrew with Tap
        uses: ./.github/actions/setup-homebrew-with-tap
        with:
          ref: ${{ steps.checkout.outputs.commit }}

      - name: 📦 Install package
        run: brew install --verbose "$package"
        env:
          package: ${{ inputs.package }}
          HOMEBREW_NO_SANDBOX_LINUX: 1
