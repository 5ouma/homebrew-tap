name: 🍺 Setup Homebrew with Bundler
description: Setup and cache Homebrew with Bundler RubyGems

runs:
  using: composite

  steps:
    - name: 🍺 Setup Homebrew
      id: homebrew
      uses: Homebrew/actions/setup-homebrew@4449fc2e212bdcb83f1b67b077916a27c8730e54 # master # zizmor: ignore[stale-action-refs]

    - name: 🫙 Cache Homebrew Bundler RubyGems
      id: cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.homebrew.outputs.gems-path }}
        key: ${{ runner.os }}-rubygems-${{ steps.homebrew.outputs.gems-hash }}

    - name: 💎 Install Homebrew Bundler RubyGems
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      run: brew install-bundler-gems
      shell: bash
