name: 🍺 Setup Homebrew with Bundler
description: Setup and cache Homebrew with Bundler RubyGems

runs:
  using: composite

  steps:
    - name: 🍺 Setup Homebrew
      id: homebrew
      uses: Homebrew/actions/setup-homebrew@e2455dd8b43b9e9dc8c20e368bafa1d80584480c # master # zizmor: ignore[stale-action-refs]

    - name: 🫙 Cache Homebrew Bundler RubyGems
      id: cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ steps.homebrew.outputs.gems-path }}
        key: ${{ runner.os }}-rubygems-${{ steps.homebrew.outputs.gems-hash }}

    - name: 💎 Install Homebrew Bundler RubyGems
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      run: brew install-bundler-gems
      shell: bash
